{% extends "base.html" %}
{% block content %}
<section class="login-wrap">
    <div class="login-panel shadow-sm">
        <div class="mb-4">
            <div class="brand-mark"><i class="bi bi-activity"></i></div>
            <h1 class="h3 fw-bold mb-2">SkinSeasonAI</h1>
            <p class="text-secondary mb-0">季节变化与皮肤病发病规律分析及可视化预测系统</p>
        </div>
        <form method="post">
            <div class="mb-3">
                <label class="form-label">用户名</label>
                <input class="form-control" name="username" value="admin" required>
            </div>
            <div class="mb-4">
                <label class="form-label">密码</label>
                <input class="form-control" name="password" type="password" value="admin123" required>
            </div>
            <button class="btn btn-primary w-100" type="submit"><i class="bi bi-box-arrow-in-right"></i> 登录系统</button>
        </form>
    </div>
</section>
{% endblock %}
